<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS (CDN integration) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Bootstrap Icons (CDN integration) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <title>Vanilla JS Project | Admin Panel</title>
  </head>
  <body
    class="flex flex-col w-screen bg-slate-900 text-zinc-300 min-h-dvh backdrop-blur-md"
  >
    <header
      class="flex items-center justify-between px-2 py-1 shadow-md sm:justify-center shadow-indigo-500/70"
    >
      <!-- hamburger icon -->
      <i id="hamburger-icon" class="text-2xl sm:hidden bi bi-list"></i>

      <h1 class="text-2xl font-bold text-center md:text-4xl xl:text-6xl">
        Admin Panel
      </h1>
    </header>

    <main class="relative flex w-full gap-2 px-1 py-2 grow">
      <!-- sidebar -->
      <aside
        class="z-10 flex-1 px-2 pt-1 pb-2 transition-transform duration-300 ease-in-out transform -translate-x-[105%] border rounded-tl-lg rounded-br-lg grow sm:block sm:translate-x-0 absolute sm:static bg-slate-950/90 sm:rounded-lg"
      >
        <nav>
          <!-- resources -->
          <h2
            class="pb-1 text-xl font-semibold text-center border-b md:text-2xl xl:text-4xl text-cyan-500/80"
          >
            Resources
          </h2>

          <ul
            class="flex flex-col mt-1 cursor-pointer text-md md:text-lg xl:text-2xl"
            id="resources-list"
          >
            <!-- users -->
            <li
              class="flex items-center gap-1 p-1 mt-1 rounded-md hover:ring hover:ring-cyan-500/70 group"
            >
              <i class="bi bi-people group-hover:text-cyan-500/80"></i>
              <span>Users</span>
            </li>

            <!-- posts -->
            <li
              class="flex items-center gap-1 p-1 rounded-md group hover:ring hover:ring-cyan-500/70"
            >
              <i class="bi bi-book group-hover:text-cyan-500/80"></i>
              <span>Posts</span>
            </li>

            <!-- comments -->
            <li
              class="flex items-center gap-1 p-1 rounded-md group hover:ring hover:ring-cyan-500/70"
            >
              <i class="bi bi-chat-dots group-hover:text-cyan-500/80"></i>
              <span>Comments</span>
            </li>

            <!-- roles -->
            <li
              class="flex items-center gap-1 p-1 rounded-md group hover:ring hover:ring-cyan-500/70"
            >
              <i class="bi bi-person-lock group-hover:text-cyan-500/80"
              "></i>
              <span>Roles</span>
            </li>
          </ul>

          <!-- filters -->
          <h2
            class="py-1 mt-5 text-xl font-semibold text-center border-b md:text-2xl xl:text-4xl text-emerald-500/80"
          >
            Filters
          </h2>

          <!-- search -->
          <div class="relative mt-2">
            <input
              type="search"
              name="search"
              id="search"
              placeholder="Search..."
              class="w-full px-2 py-1 border-b rounded-lg placeholder:italic placeholder:text-slate-400 md:text-lg xl:text-xl focus:outline-none focus:ring focus:ring-emerald-500/80 border-emerald-500/80"
            />
            <button type="submit" class="absolute top-1 right-3">
              <i class="cursor-pointer bi bi-search hover:text-emerald-500/80"></i>
            </button>
          </div>

          <select
            name="field-filter"
            id="select-filter"
            class="w-full px-2 py-1 mt-2 text-center border-b rounded-lg cursor-pointer group max-h-10 hover:text-emerald-500/80 bg-slate-950/90 border-emerald-500/80"
          >
            <option class="" value="">
              Select
            </option>
          </select>

          <!-- trash -->
          <h2
            class="py-1 mt-5 text-xl font-semibold text-center border-b md:text-2xl xl:text-4xl text-red-500/80"
          >
            Trash
          </h2>
          <button
            type="button"
            id="trash-icon"
            class="flex items-center w-full gap-1 p-1 py-1 mt-2 rounded-md cursor-pointer group hover:ring hover:ring-red-500/80 text-md md:text-lg xl:text-2xl"
          >
            <i class="bi bi-trash group-hover:text-red-500/80"></i>
            Trash
          </button>
        </nav>
      </aside>

      <!-- main section -->
      <section class="px-2 py-1 border rounded-lg flex-3">
        <div class="flex items-center justify-between px-2 py-1">
          <h2
            class="pb-1 text-xl font-semibold text-center md:text-2xl xl:text-4xl"
            id="dashboard-title"
          ></h2>
          <button
            type="button"
            id="add-resource"
            class="hidden p-1 text-black rounded-md cursor-pointer bg-lime-300/80 text-md md:text-lg xl:text-2xl hover:bg-lime-500/80 hover:text-slate-950"
          >
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>

        <p
          id="statement"
          class="flex items-center justify-center gap-2 text-sm md:text-lg xl:text-2xl"
        >
          <span>Loading data</span>
          <i class="animate-spin bi bi-arrow-repeat text-md md:text-lg xl:text-2xl"></i>
        </p>

        <table id="table-data" class="w-full overflow-auto text-sm md:text-lg xl:text-2xl">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </section>
    </main>

    <!-- background screen with open modal -->
    <div
      id="modal"
      class="fixed inset-0 z-50 items-center justify-center hidden bg-slate-950/80 backdrop-blur-sm"
    >
      <!-- modal wrapper -->
      <div
        class="relative z-10 w-11/12 max-w-2xl p-6 border shadow-2xl bg-slate-900 rounded-xl border-indigo-500/50"
      >
        <!-- modal title + close button -->
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-indigo-400" id="modal-title"></h3>
          <button id="close-modal" class="p-2 rounded-full cursor-pointer group hover:bg-slate-800">
            <i class="bi bi-x-lg group-hover:text-red-500/90"></i>
          </button>
        </div>

        <!-- modal content -->
        <div class="text-zinc-300" id="modal-content"></div>
      </div>
    </div>

    <!-- footer -->
    <footer
      class="py-2 text-sm text-center border-t-2 bg-slate-900 md:text-lg xl:text-xl border-indigo-500/80"
    >
      &copy; <span id="current-year">2026</span> All rights reserved
    </footer>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
